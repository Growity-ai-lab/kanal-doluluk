# Render Blueprint: uygulamanin tamami tek bir web servisi + kalici diskten ibarettir.
# Baska bir barindirma, veritabani veya depolama (Vercel, Supabase vb.) gerekmez.
services:
  - type: web
    name: kanal-doluluk-time
    runtime: node
    region: frankfurt
    plan: pro
    numInstances: 1        # kalici diskli servis tek ornek olmali; arsiv bellekte tutulur
    autoDeploy: true       # baglanan daldaki her push yeniden dagitir
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: kanal-doluluk-veri
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_OPTIONS  # Pro: 4 GB RAM; V8 heap sinirini acikca belirle (README: Olcek testi)
        value: --max-old-space-size=3072
      - key: DATA_DIR
        value: /var/data
      - key: RETENTION_DAYS  # arsivde tutulacak gun sayisi; asilinca yoneticiye temizlik uyarisi cikar
        value: "183"
      - key: SNAPSHOT_KEEP   # her yuklemeden once alinan anlik goruntulerden saklanacak adet
        value: "14"
      - key: ADMIN_PASSWORD  # acil durum yonetici hesabi (kullanici adi: admin); en az 20 karakter
        sync: false
      - key: INGEST_TOKEN    # Windows otomatik aktarimi icin; ADMIN_PASSWORD'den farkli, en az 20 karakter
        sync: false
      # E-posta bildirimi (istege bagli): asagidaki degiskenleri Render panelinde Environment sekmesine ekleyin
      # (README: "E-posta bildirimi"). Degerler depoya yazilmaz.
      #   Microsoft 365 (onerilen): GRAPH_TENANT_ID, GRAPH_CLIENT_ID, GRAPH_CLIENT_SECRET, MAIL_FROM
      #   veya SMTP: SMTP_HOST, SMTP_PORT (465 veya 587), SMTP_USER, SMTP_PASSWORD, MAIL_FROM
      #   istege bagli: PUBLIC_URL, NOTIFY_ON, NOTIFY_EMAILS
