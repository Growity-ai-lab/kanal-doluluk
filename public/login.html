<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giriş · Kanal Doluluk Analizi</title><meta name="robots" content="noindex"><style>
:root{--bg:#f2f5fa;--ink:#172642;--muted:#64748b;--line:#dde5ef;--blue:#315dea}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:14px system-ui,Segoe UI,sans-serif}
form{width:min(380px,92vw);background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px}h1{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);font-size:12px;margin:0 0 20px}label{display:block;font-size:12px;color:var(--muted);margin-top:14px}input{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fafcff;color:var(--ink);font:inherit}button{width:100%;margin-top:20px;padding:11px;border:0;border-radius:9px;background:var(--blue);color:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#msg{min-height:20px;margin-top:14px;color:#b42318;font-size:12px}
</style><form id="f"><h1>Kanal Doluluk Analizi</h1><p class="sub">TIME ekip girişi</p><label>Kullanıcı adı<input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label><label>Şifre<input id="p" type="password" autocomplete="current-password" required></label><button id="b">Giriş yap</button><div id="msg" role="alert"></div></form>
<script>
const f=document.getElementById('f'),msg=document.getElementById('msg'),b=document.getElementById('b');
f.onsubmit=async e=>{e.preventDefault();b.disabled=true;msg.textContent='';
try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-Panel-Request':'1'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});
const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Giriş yapılamadı.');location.replace('/');}
catch(err){msg.textContent=err.message;document.getElementById('p').value='';b.disabled=false;}};
</script></html>
